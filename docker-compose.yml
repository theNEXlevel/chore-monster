# Production stack, deployed as a Coolify "Docker Compose" resource. No `build:`
# keys on purpose — .github/workflows/publish.yaml builds and publishes the image.
services:
  chore-monster-db:
    image: postgres:17
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    environment:
      - POSTGRES_PASSWORD=${DATABASE_PW}
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_DB=${DATABASE_NAME}
    volumes:
      - chore-monster-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 2m
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s

  # Pre-migration backup (production only). `migrate deploy` is forward-only, so
  # this is the only way back from a bad migration. Same image as the database so
  # pg_dump is version-matched by construction. BACKUP_MODE=required makes a failed
  # dump block migrations, because chore-monster-migrations waits on this completing.
  # NOTE: these dumps live on the same host and disk as chore-monster-db — they protect
  # against a bad migration, not against losing the machine.
  chore-monster-backup:
    image: postgres:17
    entrypoint: ["/bin/sh", "-euc"]
    command:
      - |
        MODE="$${BACKUP_MODE:-required}"
        case "$$MODE" in
          off) echo "[backup] BACKUP_MODE=off; skipping the pre-migration backup."; exit 0 ;;
          best-effort|required) ;;
          *) echo "[backup] ERROR: BACKUP_MODE must be off, best-effort or required (got '$$MODE')."; exit 1 ;;
        esac

        stamp=$$(date -u +%Y%m%dT%H%M%SZ)
        final="/backups/pre-migrate-$$stamp.dump"
        tmp="/backups/.pre-migrate-$$stamp.dump"

        # Move into place only after verifying, so a partial file never looks like a good backup.
        fail() {
          echo "[backup] $$1"
          rm -f "$$tmp"
          if [ "$$MODE" = required ]; then exit 1; fi
          echo "[backup] continuing anyway because BACKUP_MODE=$$MODE."
          exit 0
        }

        echo "[backup] Dumping $$PGDATABASE from $$PGHOST:$${PGPORT:-5432} to $$final ..."
        pg_dump -Fc -f "$$tmp" || fail "pg_dump failed"
        pg_restore --list "$$tmp" >/dev/null 2>&1 || fail "dump failed pg_restore --list verification"
        mv "$$tmp" "$$final"
        echo "[backup] Backup complete: $$final ($$(du -h "$$final" | cut -f1))"

        ls -1t /backups/pre-migrate-*.dump 2>/dev/null | tail -n "+$$(( $${BACKUP_KEEP:-10} + 1 ))" | while read -r old; do
          echo "[backup] Pruning old backup $$(basename "$$old")"
          rm -f "$$old"
        done
    environment:
      - PGHOST=chore-monster-db
      - PGUSER=${DATABASE_USER}
      - PGPASSWORD=${DATABASE_PW}
      - PGDATABASE=${DATABASE_NAME}
      - BACKUP_MODE=${BACKUP_MODE:-required}
      - BACKUP_KEEP=${BACKUP_KEEP:-10}
    volumes:
      - chore-monster-backups:/backups
    restart: "no"
    depends_on:
      chore-monster-db:
        condition: service_healthy
    profiles:
      - production

  # Database migrations (production only). Same image as the app, different
  # command — the image ships the Prisma CLI for exactly this.
  chore-monster-migrations:
    image: ghcr.io/thenexlevel/chore-monster:${IMAGE_TAG:-latest}
    command: ["node", "/node_modules/prisma/build/index.js", "migrate", "deploy"]
    environment:
      - DATABASE_URL=postgresql://${DATABASE_USER}:${DATABASE_PW}@chore-monster-db:5432/${DATABASE_NAME}
    restart: "no"
    depends_on:
      chore-monster-db:
        condition: service_healthy
      chore-monster-backup:
        condition: service_completed_successfully
    profiles:
      - production

  # Next.js application (production only)
  chore-monster-app:
    image: ghcr.io/thenexlevel/chore-monster:${IMAGE_TAG:-latest}
    ports:
      - "${APP_PORT-3001:}3000"
    environment:
      - DATABASE_URL=postgresql://${DATABASE_USER}:${DATABASE_PW}@chore-monster-db:5432/${DATABASE_NAME}
      - DATABASE_PW=${DATABASE_PW}
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_NAME=${DATABASE_NAME}
      - DATABASE_HOST=chore-monster-db
      - DATABASE_PORT=5432
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID}
      - AUTH_GOOGLE_SECRET=${AUTH_GOOGLE_SECRET}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - NEXT_PUBLIC_VAPID_PUBLIC_KEY=${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
    command: node server.js
    depends_on:
      chore-monster-db:
        condition: service_healthy
      chore-monster-migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 2m
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 5s
    profiles:
      - production

volumes:
  chore-monster-db-data:
  # Pre-migration dumps; must outlive the one-shot backup container.
  chore-monster-backups:
